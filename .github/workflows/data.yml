name: Actualizar ranking

on:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC
  workflow_dispatch:
    inputs:
      countries:
        description: 'Slugs a traer (vacío = refrescar los publicados). Ej: uruguay ecuador'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Traer datos
        # GH_PAT (token clásico, sin scopes) da 5000 req/h contra 1000 del
        # GITHUB_TOKEN por defecto.
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch.mjs ${{ inputs.countries }}
      - name: Commitear cambios
        run: |
          git config user.name 'top-coders bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
